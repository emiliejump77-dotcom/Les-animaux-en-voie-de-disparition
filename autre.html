  <!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Édition en temps réel</title>
    <style>
        #output {
            border: 1px solid #ccc;
            padding: 10px;
            margin-top: 10px;
            min-height: 100px;
        }
    </style>
</head>
<body>
    <h1>Écrivez la somme que vous souhaitez donner</h1>
    <textarea id="input" placeholder="Tapez ici..."></textarea>
    <div id="output"></div>

    <script>
        const input = document.getElementById('input');
        const output = document.getElementById('output');

        input.addEventListener('input', () => {
            output.textContent = input.value;
        });
    </script>
</body>
